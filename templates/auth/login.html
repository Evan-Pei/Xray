<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xray | Admin Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8fafc; color: #1e293b; }
        .container { max-width: 420px; margin: 80px auto; padding: 24px; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; }
        h1 { margin-top: 0; font-size: 24px; }
        label { display: block; margin-top: 12px; font-weight: 600; }
        input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 6px; border: 1px solid #cbd5e1; border-radius: 6px; }
        button { margin-top: 16px; width: 100%; padding: 10px; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-weight: 700; cursor: pointer; }
        .error { color: #b91c1c; margin-top: 10px; }
        .home { display: inline-block; margin-top: 12px; color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Admin Login</h1>
        <form method="post">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>
            <button type="submit">Sign In</button>
        </form>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <a class="home" href="/">← Back to Home</a>
    </main>
</body>
</html>
