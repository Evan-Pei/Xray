<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xray | Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8fafc; color: #1e293b; }
        .container { max-width: 1000px; margin: 50px auto; padding: 24px; }
        .header { background: #0f172a; color: #fff; padding: 20px; border-radius: 12px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; }
        .label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: .08em; }
        .value { font-size: 26px; font-weight: 700; margin-top: 8px; }
    </style>
</head>
<body>
    <main class="container">
        <section class="header">
            <h1>Xray Dashboard</h1>
            <p>Quick overview of booking and machine status.</p>
        </section>
        <section class="cards">
            {% for metric in metrics %}
            <article class="card">
                <div class="label">{{ metric.label }}</div>
                <div class="value">{{ metric.value }}</div>
            </article>
            {% endfor %}
        </section>
    </main>
</body>
</html>
