<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xray | Admin Machine Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8fafc; color: #1e293b; }
        .container { max-width: 1050px; margin: 40px auto; padding: 24px; }
        .header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        h1 { margin: 0; }
        .sub { color: #64748b; margin-top: 4px; }
        .logout { color: #2563eb; text-decoration: none; font-weight: 600; }
        .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; margin-top: 20px; }
        .form-grid { display: grid; gap: 10px; grid-template-columns: 1fr 2fr auto auto; align-items: end; }
        input, select { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; box-sizing: border-box; }
        button { padding: 8px 12px; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; font-weight: 700; }
        table { width: 100%; border-collapse: collapse; margin-top: 14px; }
        th, td { border-bottom: 1px solid #e2e8f0; padding: 10px 8px; text-align: left; vertical-align: top; }
        .status { font-size: 12px; font-weight: 700; text-transform: uppercase; padding: 3px 8px; border-radius: 20px; display: inline-block; }
        .status.online { background: #dcfce7; color: #15803d; }
        .status.offline { background: #fee2e2; color: #b91c1c; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .actions form { margin: 0; }
        .btn-muted { background: #475569; }
        .btn-danger { background: #b91c1c; }
    </style>
</head>
<body>
    <main class="container">
        <section class="header">
            <div>
                <h1>Machine Management</h1>
                <p class="sub">Signed in as {{ current_user.username }}</p>
            </div>
            <a class="logout" href="{{ url_for('auth.logout') }}">Logout</a>
        </section>

        <section class="panel">
            <h2>Create New Machine</h2>
            <form method="post" class="form-grid">
                <div>
                    <label for="name">Name</label>
                    <input id="name" name="name" required>
                </div>
                <div>
                    <label for="description">Description</label>
                    <input id="description" name="description" required>
                </div>
                <div>
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="online">online</option>
                        <option value="offline">offline</option>
                    </select>
                </div>
                <button type="submit">Create</button>
            </form>
        </section>

        <section class="panel">
            <h2>Records</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for machine in machines %}
                    <tr>
                        <td>{{ machine.id }}</td>
                        <td>{{ machine.name }}</td>
                        <td>{{ machine.description }}</td>
                        <td><span class="status {{ machine.status }}">{{ machine.status }}</span></td>
                        <td>
                            <div class="actions">
                                <a href="{{ url_for('admin.edit_machine', machine_id=machine.id) }}">Edit</a>
                                <form method="post" action="{{ url_for('admin.toggle_machine_status', machine_id=machine.id) }}">
                                    <button class="btn-muted" type="submit">Toggle Status</button>
                                </form>
                                <form method="post" action="{{ url_for('admin.delete_machine', machine_id=machine.id) }}">
                                    <button class="btn-danger" type="submit">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
