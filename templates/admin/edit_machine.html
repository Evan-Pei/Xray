<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xray | Edit Machine</title>
    <style>
        :root {
            --navy: #0f172a;
            --blue: #2563eb;
            --slate: #475569;
            --border: #e2e8f0;
            --bg: #f8fafc;
            --text: #1e293b;
            --muted: #64748b;
            --green-bg: #dcfce7;
            --green-text: #166534;
            --red-bg: #fee2e2;
            --red-text: #991b1b;
            --yellow-bg: #fef3c7;
            --yellow-text: #92400e;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 720px;
            margin: 48px auto;
            padding: 0 20px;
        }

        .panel {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.04);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 30px;
            color: #0b2450;
        }

        .sub {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: 15px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 8px;
            font-weight: 700;
            color: #334155;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            background: #fff;
        }

        .status-preview {
            margin-top: 18px;
        }

        .status {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 999px;
            display: inline-block;
            letter-spacing: 0.03em;
        }

        .status.online {
            background: var(--green-bg);
            color: var(--green-text);
        }

        .status.offline {
            background: var(--red-bg);
            color: var(--red-text);
        }

        .status.maintenance {
            background: var(--yellow-bg);
            color: var(--yellow-text);
        }

        .row {
            display: flex;
            gap: 10px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        button,
        .back {
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button {
            background: var(--blue);
            color: #fff;
        }

        .back {
            background: var(--slate);
            color: #fff;
        }

        .flash {
            margin-top: 14px;
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 14px;
        }

        .flash.error {
            background: var(--red-bg);
            color: var(--red-text);
        }

        .flash:not(.error) {
            background: var(--green-bg);
            color: var(--green-text);
        }
    </style>
</head>
<body>
    <main class="container">
        <section class="panel">
            <h1>Edit Machine #{{ machine.id }}</h1>
            <p class="sub">Update machine details and save changes.</p>

            {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}

            <form method="post">
                <label for="id">ID</label>
                <input id="id" name="id" type="number" min="1" value="{{ machine.id }}" required>

                <label for="name">Name</label>
                <input id="name" name="name" value="{{ machine.name }}" required>

                <label for="description">Description</label>
                <input id="description" name="description" value="{{ machine.description }}" required>

                <label for="status">Status</label>
                <select id="status" name="status" required>
                    {% for status in statuses %}
                    <option value="{{ status }}" {% if machine.status == status %}selected{% endif %}>{{ status }}</option>
                    {% endfor %}
                </select>

                <div class="status-preview">
                    <span id="statusBadge" class="status {{ machine.status }}">{{ machine.status }}</span>
                </div>

                <div class="row">
                    <button type="submit">Save</button>
                    <a class="back" href="{{ url_for('admin.machine_list') }}">Back</a>
                </div>
            </form>
        </section>
    </main>

    <script>
        const statusSelect = document.getElementById("status");
        const statusBadge = document.getElementById("statusBadge");

        function updateStatusBadge() {
            const value = statusSelect.value;
            statusBadge.textContent = value;
            statusBadge.className = "status " + value;
        }

        statusSelect.addEventListener("change", updateStatusBadge);
        updateStatusBadge();
    </script>
</body>
</html>
