<!doctype html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xray | 行事曆 Schedule</title>
    <style>
        /* ── Reset & Tokens ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --navy: #0f172a;
            --blue: #2563eb;
            --blue-hover: #1d4ed8;
            --blue-light: #dbeafe;
            --border: #e2e8f0;
            --bg: #f8fafc;
            --bg2: #f1f5f9;
            --text: #0f172a;
            --muted: #64748b;
            --white: #ffffff;
            --radius: 12px;
            --shadow: 0 4px 16px rgba(15,23,42,.08);
            --shadow-lg: 0 8px 32px rgba(15,23,42,.14);
            /* status colours */
            --pending-bg: #fef3c7; --pending-text: #92400e; --pending-dot: #f59e0b;
            --approved-bg: #d1fae5; --approved-text: #065f46; --approved-dot: #10b981;
            --completed-bg: #dbeafe; --completed-text: #1e40af; --completed-dot: #3b82f6;
            --cancelled-bg: #f1f5f9; --cancelled-text: #475569; --cancelled-dot: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Top Nav ── */
        .topnav {
            background: var(--navy);
            color: #fff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .topnav-brand {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -.3px;
        }
        .topnav-links { display: flex; gap: 24px; }
        .topnav-links a {
            color: #93c5fd;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
        }
        .topnav-links a:hover { color: #fff; }

        /* ── Page layout ── */
        .page { max-width: 1600px; margin: 0 auto; padding: 20px 16px 40px; }

        /* ── Three-column calendar layout ── */
        .cal-layout {
            display: grid;
            grid-template-columns: 200px 1fr 200px;
            gap: 16px;
            align-items: start;
        }

        /* ── Mini Calendar ── */
        .mini-cal {
            background: var(--white);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 14px 12px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: box-shadow .15s;
        }
        .mini-cal:hover { box-shadow: var(--shadow-lg); }
        .mini-cal-header {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 10px;
            line-height: 1.3;
        }
        .mini-cal table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }
        .mini-cal th {
            color: var(--muted);
            text-align: center;
            padding: 2px 1px;
            font-weight: 600;
        }
        .mini-cal td {
            text-align: center;
            padding: 3px 1px;
            border-radius: 4px;
            color: var(--text);
        }
        .mini-cal td.empty { color: transparent; }
        .mini-cal td.has-booking {
            background: var(--blue-light);
            font-weight: 700;
            color: var(--blue);
        }

        /* ── Main Calendar ── */
        .main-cal {
            background: var(--white);
            border-radius: 18px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .month-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 12px;
            border-bottom: 1px solid var(--border);
        }
        .month-nav h2 {
            font-size: 22px;
            font-weight: 800;
            color: var(--navy);
        }
        .nav-btn {
            border: 1px solid var(--border);
            background: var(--white);
            border-radius: 8px;
            width: 36px; height: 36px;
            cursor: pointer;
            font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: background .12s;
        }
        .nav-btn:hover { background: var(--bg2); }
        .today-btn {
            border: 1px solid var(--border);
            background: var(--white);
            border-radius: 8px;
            padding: 0 14px;
            height: 36px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: var(--blue);
            transition: background .12s;
        }
        .today-btn:hover { background: var(--blue-light); }

        .cal-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        .cal-table th {
            background: var(--navy);
            color: #fff;
            padding: 10px 8px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }
        .cal-table td {
            border: 1px solid var(--border);
            vertical-align: top;
            height: 120px;
            padding: 8px 6px 6px;
            background: var(--white);
            transition: background .12s;
        }
        .cal-table td.empty { background: var(--bg); }
        .cal-table td.cal-day { cursor: pointer; }
        .cal-table td.cal-day:hover { background: #f0f7ff; }
        .cal-table td.today-cell { background: #eff6ff; }

        .day-num {
            font-size: 15px;
            font-weight: 700;
            color: var(--navy);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px; height: 28px;
            border-radius: 50%;
            line-height: 1;
        }
        .day-num.today {
            background: var(--blue);
            color: #fff;
        }

        .chip {
            display: flex;
            align-items: center;
            gap: 5px;
            border-radius: 5px;
            padding: 3px 6px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 3px;
            cursor: pointer;
            line-height: 1.3;
            transition: filter .1s;
            overflow: hidden;
        }
        .chip:hover { filter: brightness(.93); }
        .chip-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .chip-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .chip.pending   { background: var(--pending-bg);   color: var(--pending-text); }
        .chip.approved  { background: var(--approved-bg);  color: var(--approved-text); }
        .chip.completed { background: var(--completed-bg); color: var(--completed-text); }
        .chip.cancelled { background: var(--cancelled-bg); color: var(--cancelled-text); }
        .chip.pending   .chip-dot { background: var(--pending-dot); }
        .chip.approved  .chip-dot { background: var(--approved-dot); }
        .chip.completed .chip-dot { background: var(--completed-dot); }
        .chip.cancelled .chip-dot { background: var(--cancelled-dot); }

        .more-chip {
            font-size: 10px;
            color: var(--muted);
            padding: 2px 6px;
            margin-top: 2px;
        }

        /* ── Legend ── */
        .legend {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            font-size: 12px;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

        /* ── Modal overlay ── */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,.45);
            display: none;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .overlay.open { display: flex; }

        .modal {
            background: var(--white);
            border-radius: 18px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 560px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px 14px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--white);
            z-index: 1;
        }
        .modal-header h3 {
            font-size: 18px;
            font-weight: 800;
            color: var(--navy);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--muted);
            width: 32px; height: 32px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            transition: background .12s;
        }
        .modal-close:hover { background: var(--bg2); color: var(--text); }
        .modal-body { padding: 20px 24px; }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            padding: 16px 24px 20px;
            border-top: 1px solid var(--border);
        }

        /* ── Form fields ── */
        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 5px;
        }
        .field label .req { color: #ef4444; margin-left: 2px; }
        .field input, .field select, .field textarea {
            width: 100%;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 14px;
            color: var(--text);
            background: var(--white);
            transition: border-color .12s;
            font-family: inherit;
        }
        .field input:focus, .field select:focus, .field textarea:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(37,99,235,.12);
        }
        .field textarea { resize: vertical; min-height: 72px; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .field-readonly {
            padding: 9px 12px;
            border-radius: 8px;
            background: var(--bg2);
            font-size: 14px;
            color: var(--muted);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 700;
        }

        /* ── Buttons ── */
        .btn {
            border: none;
            border-radius: 9px;
            padding: 0 20px;
            height: 40px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: filter .12s, opacity .12s;
        }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-primary { background: var(--blue); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: var(--blue-hover); }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover:not(:disabled) { background: #dc2626; }
        .btn-ghost {
            background: none;
            border: 1.5px solid var(--border);
            color: var(--text);
        }
        .btn-ghost:hover:not(:disabled) { background: var(--bg2); }
        .btn-warning { background: #f59e0b; color: #fff; }
        .btn-warning:hover:not(:disabled) { background: #d97706; }

        /* Detail view */
        .detail-row {
            display: flex;
            gap: 8px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            align-items: flex-start;
        }
        .detail-row:last-child { border-bottom: none; }
        .detail-label {
            min-width: 90px;
            font-weight: 700;
            color: var(--muted);
            font-size: 12px;
            padding-top: 1px;
        }
        .detail-val { color: var(--text); flex: 1; }

        /* ── Confirm modal ── */
        .confirm-modal {
            max-width: 380px;
        }
        .confirm-modal .modal-body {
            text-align: center;
            padding: 28px 24px 16px;
        }
        .confirm-icon {
            font-size: 44px;
            margin-bottom: 14px;
        }
        .confirm-modal p {
            font-size: 15px;
            color: var(--muted);
            line-height: 1.6;
        }

        /* ── Toast ── */
        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e293b;
            color: #fff;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            z-index: 9999;
            opacity: 0;
            transition: opacity .25s, transform .25s;
            white-space: nowrap;
            pointer-events: none;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #toast.success { background: #065f46; }
        #toast.error { background: #991b1b; }

        /* ── Loading spinner ── */
        .loading-overlay {
            position: fixed; inset: 0;
            background: rgba(248,250,252,.7);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .loading-overlay.show { display: flex; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .cal-layout {
                grid-template-columns: 1fr;
            }
            .mini-cal-aside { display: none; }
            .cal-table td { height: 90px; padding: 5px 4px 4px; }
            .day-num { font-size: 13px; width: 24px; height: 24px; }
            .chip { font-size: 10px; padding: 2px 4px; }
        }
        @media (max-width: 600px) {
            .topnav-links { gap: 14px; }
            .topnav-links a { font-size: 13px; }
            .month-nav h2 { font-size: 17px; }
            .cal-table th { font-size: 11px; padding: 8px 3px; }
            .cal-table td { height: 72px; }
            .modal { border-radius: 12px; }
            .field-row { grid-template-columns: 1fr; gap: 0; }
        }
    </style>
</head>
<body>

<!-- Top nav -->
<nav class="topnav">
    <span class="topnav-brand">🔬 Xray 行事曆</span>
    <div class="topnav-links">
        <a href="/">首頁</a>
        <a href="/dashboard">Dashboard</a>
    </div>
</nav>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
</div>

<!-- Main page -->
<div class="page">
    <div class="cal-layout" id="calLayout">
        <!-- Left: prev month mini calendar -->
        <div class="mini-cal mini-cal-aside" id="miniCalPrev" onclick="jumpToPrev()">
            <div class="mini-cal-header" id="miniPrevTitle">—</div>
            <table id="miniPrevTable"><tbody></tbody></table>
        </div>

        <!-- Center: main calendar -->
        <div class="main-cal">
            <div class="month-nav">
                <button class="nav-btn" id="btnPrev" title="上個月">&#8249;</button>
                <div style="display:flex;align-items:center;gap:12px;">
                    <h2 id="monthTitle">Loading…</h2>
                    <button class="today-btn" id="btnToday">今天</button>
                </div>
                <button class="nav-btn" id="btnNext" title="下個月">&#8250;</button>
            </div>
            <table class="cal-table">
                <thead>
                    <tr>
                        <th>一<br><small>Mon</small></th>
                        <th>二<br><small>Tue</small></th>
                        <th>三<br><small>Wed</small></th>
                        <th>四<br><small>Thu</small></th>
                        <th>五<br><small>Fri</small></th>
                        <th>六<br><small>Sat</small></th>
                        <th>日<br><small>Sun</small></th>
                    </tr>
                </thead>
                <tbody id="calBody"></tbody>
            </table>
            <div class="legend">
                <span class="legend-item"><span class="legend-dot" style="background:var(--pending-dot)"></span>待審 pending</span>
                <span class="legend-item"><span class="legend-dot" style="background:var(--approved-dot)"></span>已批 approved</span>
                <span class="legend-item"><span class="legend-dot" style="background:var(--completed-dot)"></span>完成 completed</span>
                <span class="legend-item"><span class="legend-dot" style="background:var(--cancelled-dot)"></span>取消 cancelled</span>
            </div>
        </div>

        <!-- Right: next month mini calendar -->
        <div class="mini-cal mini-cal-aside" id="miniCalNext" onclick="jumpToNext()">
            <div class="mini-cal-header" id="miniNextTitle">—</div>
            <table id="miniNextTable"><tbody></tbody></table>
        </div>
    </div>
</div>

<!-- ════════════════════════════ BOOKING MODAL ════════════════════════════ -->
<div class="overlay" id="bookingOverlay">
    <div class="modal" id="bookingModal">
        <div class="modal-header">
            <h3 id="bookingModalTitle">新增預約</h3>
            <button class="modal-close" onclick="closeBookingModal()">✕</button>
        </div>
        <div class="modal-body" id="bookingModalBody">
            <!-- View mode -->
            <div id="viewMode" style="display:none">
                <div class="detail-row">
                    <span class="detail-label">狀態</span>
                    <span class="detail-val"><span id="dStatus" class="status-badge"></span></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">開始</span>
                    <span class="detail-val" id="dStart"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">結束</span>
                    <span class="detail-val" id="dEnd"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">使用者</span>
                    <span class="detail-val" id="dUser"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">機台</span>
                    <span class="detail-val" id="dMachine"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">使用目的</span>
                    <span class="detail-val" id="dPurpose"></span>
                </div>
                <div class="detail-row" id="dNotesRow">
                    <span class="detail-label">備註</span>
                    <span class="detail-val" id="dNotes"></span>
                </div>
            </div>
            <!-- Edit/Create mode -->
            <div id="editMode" style="display:none">
                <div class="field-row">
                    <div class="field">
                        <label>開始日期 <span class="req">*</span></label>
                        <input type="date" id="fStartDate">
                    </div>
                    <div class="field">
                        <label>開始時間 <span class="req">*</span></label>
                        <select id="fStartTime"></select>
                    </div>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label>結束日期 <span class="req">*</span></label>
                        <input type="date" id="fEndDate">
                    </div>
                    <div class="field">
                        <label>結束時間 <span class="req">*</span></label>
                        <select id="fEndTime"></select>
                    </div>
                </div>
                <div class="field">
                    <label>使用者</label>
                    <select id="fUser"></select>
                </div>
                <div class="field">
                    <label>使用機台 <span class="req">*</span></label>
                    <select id="fMachine"></select>
                </div>
                <div class="field">
                    <label>使用目的 <span class="req">*</span></label>
                    <textarea id="fPurpose" placeholder="請說明使用目的…"></textarea>
                </div>
                <div class="field">
                    <label>備註（可選）</label>
                    <textarea id="fNotes" placeholder="其他備註…" style="min-height:52px"></textarea>
                </div>
                <div class="field">
                    <label>狀態</label>
                    <select id="fStatus">
                        <option value="pending">待審 pending</option>
                        <option value="approved">已批 approved</option>
                        <option value="completed">完成 completed</option>
                        <option value="cancelled">取消 cancelled</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="modal-footer" id="bookingModalFooter">
            <!-- buttons injected by JS -->
        </div>
    </div>
</div>

<!-- ════════════════════════════ CONFIRM DELETE MODAL ════════════════════════════ -->
<div class="overlay" id="confirmOverlay">
    <div class="modal confirm-modal">
        <div class="modal-body">
            <div class="confirm-icon">🗑️</div>
            <h3 style="font-size:18px;font-weight:800;margin-bottom:8px;color:var(--navy)">確認刪除？</h3>
            <p>此操作無法復原，預約將被永久刪除。</p>
        </div>
        <div class="modal-footer" style="justify-content:center;">
            <button class="btn btn-ghost" onclick="closeConfirm()">取消</button>
            <button class="btn btn-danger" id="confirmDeleteBtn">確認刪除</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────
const TODAY_YEAR  = {{ today_year }};
const TODAY_MONTH = {{ today_month }};
const TODAY_DAY   = {{ today_day }};
const CURRENT_USER = {{ current_username | tojson }};
const CURRENT_USER_ID = {{ current_user_id }};
const QUALIFIED_USERS_INITIAL = {{ qualified_users | tojson }};

let curYear  = {{ init_year }};
let curMonth = {{ init_month }};
let machines  = [];
let qualifiedUsers = [];
let bookingsCache = {};   // key: "YYYY-M" → array of booking objects
let editingId = null;     // booking id when editing
let deleteTargetId = null;

const MONTH_NAMES_ZH = [
    "", "一月","二月","三月","四月","五月","六月",
    "七月","八月","九月","十月","十一月","十二月"
];
const STATUS_LABEL = {
    pending:   "待審",
    approved:  "已批",
    completed: "完成",
    cancelled: "取消",
};
const STATUS_COLORS = {
    pending:   { bg: "#fef3c7", text: "#92400e", dot: "#f59e0b" },
    approved:  { bg: "#d1fae5", text: "#065f46", dot: "#10b981" },
    completed: { bg: "#dbeafe", text: "#1e40af", dot: "#3b82f6" },
    cancelled: { bg: "#f1f5f9", text: "#475569", dot: "#94a3b8" },
};
const DEFAULT_TITLE = "機台使用申請";

// ── Time options (15-min slots 07:00 – 22:00) ──────────────────────────
function buildTimeOptions() {
    const opts = [];
    for (let h = 7; h <= 22; h++) {
        for (let m = 0; m < 60; m += 15) {
            if (h === 22 && m > 0) break;
            opts.push(`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`);
        }
    }
    return opts;
}
const TIME_OPTIONS = buildTimeOptions();

function populateTimeSelects() {
    [document.getElementById("fStartTime"), document.getElementById("fEndTime")].forEach(sel => {
        sel.innerHTML = TIME_OPTIONS.map(t => `<option value="${t}">${t}</option>`).join("");
    });
}

// ── Utility ──────────────────────────────────────────────────────────────
function pad(n) { return String(n).padStart(2, "0"); }

function fmtDatetime(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}  ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function isoToDateStr(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function isoToTimeStr(iso) {
    const d = new Date(iso);
    // Round down to nearest 15 min in the time options list
    let h = d.getHours(), m = d.getMinutes();
    m = Math.floor(m / 15) * 15;
    return `${pad(h)}:${pad(m)}`;
}

function monthKey(y, m) { return `${y}-${m}`; }

function addMonths(y, m, delta) {
    let nm = m + delta;
    let ny = y;
    while (nm > 12) { nm -= 12; ny++; }
    while (nm < 1)  { nm += 12; ny--; }
    return [ny, nm];
}

function daysInMonth(y, m) {
    return new Date(y, m, 0).getDate();
}

// Returns 0 (Mon) … 6 (Sun) for day 1 of given month
function firstWeekday(y, m) {
    const d = new Date(y, m - 1, 1).getDay(); // 0=Sun
    return (d + 6) % 7; // shift so Mon=0
}

function buildCalGrid(y, m) {
    const days = daysInMonth(y, m);
    const start = firstWeekday(y, m);
    const cells = [];
    for (let i = 0; i < start; i++) cells.push(0);
    for (let d = 1; d <= days; d++) cells.push(d);
    while (cells.length % 7 !== 0) cells.push(0);
    const weeks = [];
    for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
    return weeks;
}

// ── API helpers ──────────────────────────────────────────────────────────
async function apiFetch(url, opts = {}) {
    const r = await fetch(url, {
        headers: { "Content-Type": "application/json" },
        ...opts,
    });
    const json = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(json.error || `HTTP ${r.status}`);
    return json;
}

async function loadMachines() {
    machines = await apiFetch("/api/machines");
    // populate dropdown
    const sel = document.getElementById("fMachine");
    sel.innerHTML = machines.map(m => `<option value="${m.id}">${m.name}</option>`).join("");
}

function renderUserOptions() {
    const sel = document.getElementById("fUser");
    sel.innerHTML = qualifiedUsers.map(u => `<option value="${u.id}">${u.username}</option>`).join("");
    if (!qualifiedUsers.length) return;
    const currentOpt = qualifiedUsers.find(u => u.id === CURRENT_USER_ID);
    sel.value = String(currentOpt ? currentOpt.id : qualifiedUsers[0].id);
}

async function loadQualifiedUsers() {
    try {
        qualifiedUsers = await apiFetch("/api/qualified-users");
    } catch (e) {
        qualifiedUsers = QUALIFIED_USERS_INITIAL;
        showToast("載入合格使用者失敗，已使用頁面資料", "error");
    } finally {
        renderUserOptions();
    }
}

async function loadBookings(y, m) {
    const key = monthKey(y, m);
    if (bookingsCache[key]) return bookingsCache[key];
    // fetch entire month + a small buffer
    const start = `${y}-${pad(m)}-01T00:00:00`;
    const endDay = daysInMonth(y, m);
    const end   = `${y}-${pad(m)}-${pad(endDay)}T23:59:59`;
    const data = await apiFetch(`/api/bookings?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`);
    bookingsCache[key] = data;
    return data;
}

function invalidateCache(y, m) {
    delete bookingsCache[monthKey(y, m)];
}

// ── Calendar rendering ────────────────────────────────────────────────────
function groupByDay(bookings, y, m) {
    const map = {};
    for (const b of bookings) {
        const d = new Date(b.start);
        if (d.getFullYear() === y && d.getMonth() + 1 === m) {
            const day = d.getDate();
            if (!map[day]) map[day] = [];
            map[day].push(b);
        }
    }
    return map;
}

function chipHTML(b) {
    const d = new Date(b.start);
    const de = new Date(b.end);
    const timeStr = `${pad(d.getHours())}:${pad(d.getMinutes())}-${pad(de.getHours())}:${pad(de.getMinutes())}`;
    const machine = machines.find(m => m.id === b.machine_id);
    const machineName = machine ? machine.name : b.machine_name || "";
    const label = `${timeStr} ${b.applicant_name} · ${machineName}`;
    return `<div class="chip ${b.status}" data-id="${b.id}" onclick="openViewBooking(${b.id},event)">
        <span class="chip-dot"></span>
        <span class="chip-text" title="${label}">${label}</span>
    </div>`;
}

async function renderMain(y, m) {
    let bookings = [];
    try {
        bookings = await loadBookings(y, m);
    } catch (e) {
        showToast("載入預約失敗: " + e.message, "error");
    }
    const byDay = groupByDay(bookings, y, m);
    const weeks = buildCalGrid(y, m);

    const isCurrentMonth = (y === TODAY_YEAR && m === TODAY_MONTH);

    const tbody = document.getElementById("calBody");
    tbody.innerHTML = weeks.map(week => `
        <tr>${week.map(day => {
            if (!day) return `<td class="empty"></td>`;
            const isToday = isCurrentMonth && day === TODAY_DAY;
            const dayBookings = byDay[day] || [];
            const MAX = 3;
            const chips = dayBookings.slice(0, MAX).map(chipHTML).join("");
            const more = dayBookings.length > MAX
                ? `<div class="more-chip">+${dayBookings.length - MAX} 更多…</div>`
                : "";
            return `<td class="cal-day${isToday ? " today-cell" : ""}" data-day="${day}" onclick="openNewBooking(${y},${m},${day},event)">
                <span class="day-num${isToday ? " today" : ""}">${day}</span>
                ${chips}${more}
            </td>`;
        }).join("")}</tr>
    `).join("");

    // Update title
    document.getElementById("monthTitle").textContent = `${y} 年 ${MONTH_NAMES_ZH[m]}`;

    // Update browser URL without reload
    const url = new URL(window.location);
    url.searchParams.set("year", y);
    url.searchParams.set("month", m);
    history.replaceState(null, "", url);
}

function renderMini(y, m, titleEl, tableEl, daysWithBookings) {
    titleEl.textContent = `${y} 年 ${MONTH_NAMES_ZH[m]}`;
    const weeks = buildCalGrid(y, m);
    tableEl.innerHTML = `
        <thead><tr>${["一","二","三","四","五","六","日"].map(d => `<th>${d}</th>`).join("")}</tr></thead>
        <tbody>${weeks.map(week => `<tr>${week.map(day => {
            if (!day) return `<td class="empty">-</td>`;
            const has = daysWithBookings && daysWithBookings.has(day);
            return `<td class="${has ? "has-booking" : ""}">${day}</td>`;
        }).join("")}</tr>`).join("")}</tbody>
    `;
}

async function renderAll() {
    showLoading(true);
    try {
        await renderMain(curYear, curMonth);

        const [prevY, prevM] = addMonths(curYear, curMonth, -1);
        const [nextY, nextM] = addMonths(curYear, curMonth, +1);

        // Mini calendars: try to load bookings for prev/next month (optional, non-blocking)
        let prevDays = null, nextDays = null;
        try {
            const prevB = await loadBookings(prevY, prevM);
            prevDays = new Set(prevB.map(b => new Date(b.start).getDate()));
        } catch (e) { console.warn("Failed to load prev month bookings:", e); }
        try {
            const nextB = await loadBookings(nextY, nextM);
            nextDays = new Set(nextB.map(b => new Date(b.start).getDate()));
        } catch (e) { console.warn("Failed to load next month bookings:", e); }

        renderMini(prevY, prevM,
            document.getElementById("miniPrevTitle"),
            document.getElementById("miniPrevTable"),
            prevDays);
        renderMini(nextY, nextM,
            document.getElementById("miniNextTitle"),
            document.getElementById("miniNextTable"),
            nextDays);
    } finally {
        showLoading(false);
    }
}

// ── Navigation ────────────────────────────────────────────────────────────
function navigate(delta) {
    [curYear, curMonth] = addMonths(curYear, curMonth, delta);
    renderAll();
}
function jumpToToday() {
    curYear  = TODAY_YEAR;
    curMonth = TODAY_MONTH;
    renderAll();
}
function jumpToPrev() {
    [curYear, curMonth] = addMonths(curYear, curMonth, -1);
    renderAll();
}
function jumpToNext() {
    [curYear, curMonth] = addMonths(curYear, curMonth, +1);
    renderAll();
}

// ── Loading ────────────────────────────────────────────────────────────────
function showLoading(on) {
    document.getElementById("loadingOverlay").classList.toggle("show", on);
}

// ── Toast ──────────────────────────────────────────────────────────────────
let _toastTimer;
function showToast(msg, type = "success") {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = `show ${type}`;
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { el.className = ""; }, 3000);
}

// ── Status badge HTML ──────────────────────────────────────────────────────
function statusBadgeHTML(status) {
    const c = STATUS_COLORS[status] || STATUS_COLORS.pending;
    const label = STATUS_LABEL[status] || status;
    return `<span class="status-badge" style="background:${c.bg};color:${c.text}">
        <span style="width:8px;height:8px;border-radius:50%;background:${c.dot};display:inline-block"></span>
        ${label}
    </span>`;
}

// ── Booking Modal: New ─────────────────────────────────────────────────────
function openNewBooking(y, m, day, evt) {
    if (evt) evt.stopPropagation();
    editingId = null;

    document.getElementById("bookingModalTitle").textContent = "新增預約";
    document.getElementById("viewMode").style.display = "none";
    document.getElementById("editMode").style.display = "block";

    // Default date
    const dateStr = `${y}-${pad(m)}-${pad(day)}`;
    document.getElementById("fStartDate").value = dateStr;
    document.getElementById("fEndDate").value   = dateStr;
    document.getElementById("fStartTime").value = "09:00";
    document.getElementById("fEndTime").value   = "10:00";
    if (qualifiedUsers.length) {
        const selectedUser = qualifiedUsers.find(u => u.id === CURRENT_USER_ID) || qualifiedUsers[0];
        document.getElementById("fUser").value = String(selectedUser.id);
    }
    document.getElementById("fPurpose").value = "";
    document.getElementById("fNotes").value   = "";
    document.getElementById("fStatus").value  = "pending";
    if (machines.length) document.getElementById("fMachine").selectedIndex = 0;

    setFooter("create");
    document.getElementById("bookingOverlay").classList.add("open");
    setTimeout(() => document.getElementById("fPurpose").focus(), 100);
}

// ── Booking Modal: View ────────────────────────────────────────────────────
function openViewBooking(id, evt) {
    if (evt) evt.stopPropagation();
    const key = monthKey(curYear, curMonth);
    const allB = bookingsCache[key] || [];
    // search across all cached months too
    let booking = null;
    for (const bArr of Object.values(bookingsCache)) {
        booking = bArr.find(b => b.id === id);
        if (booking) break;
    }
    if (!booking) { showToast("找不到預約", "error"); return; }

    editingId = id;
    document.getElementById("bookingModalTitle").textContent = "預約詳情";
    document.getElementById("viewMode").style.display = "block";
    document.getElementById("editMode").style.display = "none";

    // fill detail view
    document.getElementById("dStatus").innerHTML = statusBadgeHTML(booking.status);
    document.getElementById("dStart").textContent = fmtDatetime(booking.start);
    document.getElementById("dEnd").textContent   = fmtDatetime(booking.end);
    document.getElementById("dUser").textContent  = booking.applicant_name;
    document.getElementById("dMachine").textContent = booking.machine_name;
    document.getElementById("dPurpose").textContent = booking.purpose;
    const notesRow = document.getElementById("dNotesRow");
    const title = (booking.title || "").trim();
    if (title && title !== DEFAULT_TITLE) {
        document.getElementById("dNotes").textContent = title;
        notesRow.style.display = "";
    } else {
        notesRow.style.display = "none";
    }

    setFooter("view", booking.can_edit);
    document.getElementById("bookingOverlay").classList.add("open");
}

// ── Booking Modal: Edit ────────────────────────────────────────────────────
function switchToEdit() {
    let booking = null;
    for (const bArr of Object.values(bookingsCache)) {
        booking = bArr.find(b => b.id === editingId);
        if (booking) break;
    }
    if (!booking) return;

    document.getElementById("bookingModalTitle").textContent = "編輯預約";
    document.getElementById("viewMode").style.display = "none";
    document.getElementById("editMode").style.display = "block";

    document.getElementById("fStartDate").value = isoToDateStr(booking.start);
    document.getElementById("fEndDate").value   = isoToDateStr(booking.end);
    document.getElementById("fStartTime").value = isoToTimeStr(booking.start);
    document.getElementById("fEndTime").value   = isoToTimeStr(booking.end);
    if (booking.user_id) {
        document.getElementById("fUser").value = String(booking.user_id);
    }
    document.getElementById("fMachine").value   = booking.machine_id;
    document.getElementById("fPurpose").value   = booking.purpose;
    const title = (booking.title || "").trim();
    document.getElementById("fNotes").value     = title === DEFAULT_TITLE ? "" : title;
    document.getElementById("fStatus").value    = booking.status;

    setFooter("edit");
}

// ── Footer buttons ─────────────────────────────────────────────────────────
function setFooter(mode, canEdit) {
    const f = document.getElementById("bookingModalFooter");
    if (mode === "create") {
        f.innerHTML = `
            <button class="btn btn-ghost" onclick="closeBookingModal()">取消</button>
            <button class="btn btn-primary" onclick="submitBooking()">建立預約</button>`;
    } else if (mode === "view") {
        f.innerHTML = canEdit
            ? `<button class="btn btn-ghost" onclick="closeBookingModal()">關閉</button>
               <button class="btn btn-warning" onclick="openDeleteConfirm()">🗑 刪除</button>
               <button class="btn btn-primary" onclick="switchToEdit()">✏️ 編輯</button>`
            : `<button class="btn btn-ghost" onclick="closeBookingModal()">關閉</button>`;
    } else { // edit
        f.innerHTML = `
            <button class="btn btn-ghost" onclick="closeBookingModal()">取消</button>
            <button class="btn btn-primary" onclick="submitBooking()">儲存變更</button>`;
    }
}

function closeBookingModal() {
    document.getElementById("bookingOverlay").classList.remove("open");
    editingId = null;
}

// ── Submit ─────────────────────────────────────────────────────────────────
async function submitBooking() {
    const startDate = document.getElementById("fStartDate").value;
    const startTime = document.getElementById("fStartTime").value;
    const endDate   = document.getElementById("fEndDate").value;
    const endTime   = document.getElementById("fEndTime").value;
    const userId    = parseInt(document.getElementById("fUser").value);
    const machineId = parseInt(document.getElementById("fMachine").value);
    const purpose   = document.getElementById("fPurpose").value.trim();
    const notes     = document.getElementById("fNotes").value.trim();
    const status    = document.getElementById("fStatus").value;

    if (!startDate || !startTime || !endDate || !endTime) {
        showToast("請填寫日期和時間", "error"); return;
    }
    if (!userId) { showToast("請選擇使用者", "error"); return; }
    if (!purpose) { showToast("請填寫使用目的", "error"); return; }
    if (!machineId) { showToast("請選擇機台", "error"); return; }

    const start = `${startDate}T${startTime}:00`;
    const end   = `${endDate}T${endTime}:00`;
    if (new Date(start) >= new Date(end)) {
        showToast("結束時間必須晚於開始時間", "error"); return;
    }

    const payload = {
        start,
        end,
        user_id: userId,
        machine_id: machineId,
        purpose,
        title: notes || DEFAULT_TITLE,
        status,
    };

    showLoading(true);
    try {
        if (editingId) {
            await apiFetch(`/api/bookings/${editingId}`, {
                method: "PUT",
                body: JSON.stringify(payload),
            });
            showToast("預約已更新 ✓", "success");
        } else {
            await apiFetch("/api/bookings", {
                method: "POST",
                body: JSON.stringify(payload),
            });
            showToast("預約已建立 ✓", "success");
        }
        closeBookingModal();
        // invalidate cache for affected months
        const startM = new Date(start).getMonth() + 1;
        const startY = new Date(start).getFullYear();
        const endM   = new Date(end).getMonth() + 1;
        const endY   = new Date(end).getFullYear();
        invalidateCache(startY, startM);
        if (startY !== endY || startM !== endM) invalidateCache(endY, endM);
        await renderAll();
    } catch (e) {
        const msg = e.message;
        if (msg.includes("conflict")) {
            showToast("⚠️ 時間或機台衝突，請調整", "error");
        } else {
            showToast("操作失敗: " + msg, "error");
        }
    } finally {
        showLoading(false);
    }
}

// ── Delete ─────────────────────────────────────────────────────────────────
function openDeleteConfirm() {
    deleteTargetId = editingId;
    document.getElementById("confirmOverlay").classList.add("open");
}
function closeConfirm() {
    document.getElementById("confirmOverlay").classList.remove("open");
    deleteTargetId = null;
}

async function confirmDelete() {
    if (!deleteTargetId) return;
    showLoading(true);
    try {
        await apiFetch(`/api/bookings/${deleteTargetId}`, { method: "DELETE" });
        showToast("預約已刪除", "success");
        closeConfirm();
        closeBookingModal();
        // find which month the booking was in and invalidate cache
        for (const [key, arr] of Object.entries(bookingsCache)) {
            if (arr.find(b => b.id === deleteTargetId)) {
                delete bookingsCache[key];
            }
        }
        await renderAll();
    } catch (e) {
        showToast("刪除失敗: " + e.message, "error");
    } finally {
        showLoading(false);
    }
}

// Close overlays on backdrop click
document.getElementById("bookingOverlay").addEventListener("click", e => {
    if (e.target === document.getElementById("bookingOverlay")) closeBookingModal();
});
document.getElementById("confirmOverlay").addEventListener("click", e => {
    if (e.target === document.getElementById("confirmOverlay")) closeConfirm();
});

// ── Wire buttons ───────────────────────────────────────────────────────────
document.getElementById("btnPrev").addEventListener("click", () => navigate(-1));
document.getElementById("btnNext").addEventListener("click", () => navigate(+1));
document.getElementById("btnToday").addEventListener("click", jumpToToday);
document.getElementById("confirmDeleteBtn").addEventListener("click", confirmDelete);

// ── Init ───────────────────────────────────────────────────────────────────
(async () => {
    populateTimeSelects();
    try {
        await Promise.all([loadMachines(), loadQualifiedUsers()]);
    } catch (e) {
        showToast("載入資料失敗: " + e.message, "error");
    }
    await renderAll();
})();
</script>
