<!doctype html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xray | 行事曆 Schedule</title>
    <style>
        /* ── Reset & Tokens ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --navy: #0f172a;
            --blue: #2563eb;
            --blue-hover: #1d4ed8;
            --blue-light: #dbeafe;
            --border: #e2e8f0;
            --bg: #f8fafc;
            --bg2: #f1f5f9;
            --text: #0f172a;
            --muted: #64748b;
            --white: #ffffff;
            --radius: 12px;
            --shadow: 0 4px 16px rgba(15,23,42,.08);
            --shadow-lg: 0 8px 32px rgba(15,23,42,.14);
            /* status colours */
            --pending-bg: #fef3c7; --pending-text: #92400e; --pending-dot: #f59e0b;
            --approved-bg: #d1fae5; --approved-text: #065f46; --approved-dot: #10b981;
            --completed-bg: #dbeafe; --completed-text: #1e40af; --completed-dot: #3b82f6;
            --cancelled-bg: #f1f5f9; --cancelled-text: #475569; --cancelled-dot: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Top Nav ── */
        .topnav {
            background: var(--navy);
            color: #fff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .topnav-brand {
            font-size: 20px;
            font-weight: 600;
        }
        .topnav-links {
            display: flex;
            gap: 24px;
        }
        .topnav-links a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
        }
        .topnav-links a:hover {
            opacity: 0.7;
        }

        /* ── Page Layout ── */
        .page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .cal-layout {
            display: grid;
            grid-template-columns: 250px 1fr 250px;
            gap: 24px;
        }

        /* ── Mini Calendar ── */
        .mini-cal {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
        }
        .mini-cal-header {
            font-weight: 600;
            text-align: center;
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--text);
        }
        .mini-cal table {
            width: 100%;
            border-collapse: collapse;
        }
        .mini-cal th {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            padding: 8px 0;
            text-align: center;
        }
        .mini-cal td {
            font-size: 12px;
            padding: 6px;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
        }
        .mini-cal td.empty {
            color: #ccc;
            cursor: default;
        }
        .mini-cal td.has-booking {
            background: var(--blue-light);
            color: var(--blue);
            font-weight: 600;
        }

        /* ── Main Calendar ── */
        .main-cal {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .month-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        .nav-btn {
            background: var(--blue);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        .nav-btn:hover {
            background: var(--blue-hover);
        }
        .month-title {
            font-size: 20px;
            font-weight: 600;
            min-width: 200px;
            text-align: center;
        }

        .cal-table {
            width: 100%;
            border-collapse: collapse;
        }
        .cal-table thead th {
            background: var(--bg2);
            padding: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            color: var(--text);
        }
        .cal-table td {
            border: 1px solid var(--border);
            padding: 12px;
            height: 120px;
            vertical-align: top;
            background: var(--white);
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
        }
        .cal-table td:hover {
            background: var(--bg2);
        }
        .cal-table td.empty {
            background: #fafafa;
            cursor: default;
        }
        .cal-table td.today {
            background: rgba(37, 99, 235, 0.05);
        }

        .cal-date {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text);
        }

        /* ── Chips (Booking Items) ── */
        .chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--pending-bg);
            color: var(--pending-text);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-bottom: 4px;
            cursor: pointer;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            border-left: 3px solid var(--pending-dot);
            transition: transform 0.1s;
        }
        .chip:hover {
            transform: scale(1.02);
        }
        .chip.approved {
            background: var(--approved-bg);
            color: var(--approved-text);
            border-left-color: var(--approved-dot);
        }
        .chip.completed {
            background: var(--completed-bg);
            color: var(--completed-text);
            border-left-color: var(--completed-dot);
        }
        .chip.cancelled {
            background: var(--cancelled-bg);
            color: var(--cancelled-text);
            border-left-color: var(--cancelled-dot);
            text-decoration: line-through;
        }
        .chip-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }
        .chip-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .more-chip {
            font-size: 11px;
            color: var(--muted);
            padding: 4px 8px;
            cursor: pointer;
        }
        .more-chip:hover {
            color: var(--blue);
        }

        /* ── Loading Overlay ── */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .loading-overlay.show {
            display: flex;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #ddd;
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Toast ── */
        #toast {
            position: fixed;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 14px;
            transition: bottom 0.3s;
            z-index: 1000;
            max-width: 90%;
        }
        #toast.show {
            bottom: 24px;
        }
        #toast.success {
            background: #10b981;
        }
        #toast.error {
            background: #ef4444;
        }

        /* ── Modal Overlays ── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
        }
        .overlay.open {
            display: flex;
        }
        .modal {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--muted);
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            color: var(--text);
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--blue);
            color: #fff;
        }
        .btn-primary:hover {
            background: var(--blue-hover);
        }
        .btn-secondary {
            background: var(--border);
            color: var(--text);
        }
        .btn-secondary:hover {
            background: #cbd5e1;
        }
        .btn-danger {
            background: #ef4444;
            color: #fff;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ── Forms ── */
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* ── Detail View vs Edit Mode ── */
        .detail-group {
            margin-bottom: 16px;
        }
        .detail-label {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .detail-value {
            font-size: 14px;
            color: var(--text);
            margin-top: 4px;
        }

        /* ── Confirmation Modal ── */
        .confirm-message {
            font-size: 14px;
            color: var(--text);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        @media (max-width: 1024px) {
            .cal-layout {
                grid-template-columns: 1fr;
            }
            .mini-cal {
                display: none;
            }
        }
    </style>
</head>

<!-- Top nav -->
<nav class="topnav">

<!-- Main page -->

<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────
const TODAY_YEAR  = {{ today_year }};
const TODAY_MONTH = {{ today_month }};
const TODAY_DAY   = {{ today_day }};
const CURRENT_USER = {{ current_username | tojson }};
const CURRENT_USER_ID = {{ current_user_id | tojson }};
const QUALIFIED_USERS_INITIAL = {{ qualified_users | tojson }};

let curYear  = {{ init_year }};
let curMonth = {{ init_month }};
let machines  = [];
let qualifiedUsers = [];
let bookingsCache = {};   // key: "YYYY-M" → array of booking objects
let editingId = null;     // booking id when editing
let deleteTargetId = null;

const MONTH_NAMES_ZH = [
    "", "一月","二月","三月","四月","五月","六月",
    "七月","八月","九月","十月","十一月","十二月"
];
const STATUS_LABEL = {
    pending:   "待審",
    approved:  "已批",
    completed: "完成",
    cancelled: "取消",
};
const STATUS_COLORS = {
    pending:   { bg: "#fef3c7", text: "#92400e", dot: "#f59e0b" },
    approved:  { bg: "#d1fae5", text: "#065f46", dot: "#10b981" },
    completed: { bg: "#dbeafe", text: "#1e40af", dot: "#3b82f6" },
    cancelled: { bg: "#f1f5f9", text: "#475569", dot: "#94a3b8" },
};
const DEFAULT_TITLE = "機台使用申請";

// ── Time options (15-min slots 07:00 – 22:00) ──────────────────────────
function buildTimeOptions() {
    const opts = [];
    for (let h = 7; h <= 22; h++) {
        for (let m = 0; m < 60; m += 15) {
            if (h === 22 && m > 0) break;
            opts.push(`${pad(h)}:${pad(m)}`);
        }
    }
    return opts;
}

function populateTimeSelects() {
    const opts = buildTimeOptions();
    const optionsHtml = opts.map(t => `<option value="${t}">${t}</option>`).join("");
    document.getElementById("fStartTime").innerHTML = optionsHtml;
    document.getElementById("fEndTime").innerHTML = optionsHtml;
}

// ── Utilities ──────────────────────────────────────────────────────────
function pad(n) { return String(n).padStart(2, '0'); }

function fmtDatetime(isoStr) {
    if (!isoStr) return "—";
    const d = new Date(isoStr + "Z");
    return d.toLocaleString('zh-TW');
}

function isoToDateStr(isoStr) {
    return isoStr.substring(0, 10);
}

function isoToTimeStr(isoStr) {
    const dt = isoStr.substring(11, 16);
    const [h, m] = dt.split(':');
    const hm = Math.floor(Number(m) / 15);
    return `${h}:${pad(hm * 15)}`;
}

function toLocalInputValue(isoStr) {
    const d = new Date(isoStr + "Z");
    return d.toISOString().substring(0, 16);
}

function monthKey(y, m) { return `${y}-${m}`; }

function addMonths(y, m, delta) {
    let nm = m + delta;
    let ny = y;
    while (nm > 12) { nm -= 12; ny++; }
    while (nm < 1)  { nm += 12; ny--; }
    return [ny, nm];
}

function daysInMonth(y, m) {
    return new Date(y, m, 0).getDate();
}

// Returns 0 (Mon) … 6 (Sun) for day 1 of given month
function firstWeekday(y, m) {
    const d = new Date(y, m - 1, 1).getDay(); // 0=Sun
    return (d + 6) % 7; // shift so Mon=0
}

// ── API helpers ──────────────────────────────────────────────────────
async function apiFetch(url, opts = {}) {
    const r = await fetch(url, {
        headers: { "Content-Type": "application/json" },
        ...opts,
    });
    const json = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(json.error || `HTTP ${r.status}`);
    return json;
}

async function loadMachines() {
    machines = await apiFetch("/api/machines");
    const sel = document.getElementById("fMachine");
    sel.innerHTML = machines.map(m => `<option value="${m.id}">${m.name}</option>`).join("");
    if (machines.length) sel.selectedIndex = 0;
}

function getDefaultQualifiedUser() {
    if (!qualifiedUsers.length) return null;
    return qualifiedUsers.find(u => u.id === CURRENT_USER_ID) || qualifiedUsers[0];
}

function renderUserOptions() {
    const sel = document.getElementById("fUser");
    sel.innerHTML = qualifiedUsers.map(u => `<option value="${u.id}">${u.username}</option>`).join("");
    const selectedUser = getDefaultQualifiedUser();
    if (selectedUser) {
        sel.value = String(selectedUser.id);
    }
}

async function loadQualifiedUsers() {
    try {
        qualifiedUsers = await apiFetch("/api/qualified-users");
    } catch (e) {
        qualifiedUsers = QUALIFIED_USERS_INITIAL;
        showToast("載入合格使用者失敗", "error");
    }
    renderUserOptions();
}

/**
 * Load bookings for a given month, with buffer to include cross-month bookings.
 * Extend the query range by 1 month before and after to catch bookings that span.
 */
async function loadBookings(y, m) {
    const key = monthKey(y, m);
    if (bookingsCache[key]) return bookingsCache[key];

    // Extend range: load data from previous month to next month
    // to ensure we capture all bookings that touch this calendar month
    const [prevY, prevM] = addMonths(y, m, -1);
    const [nextY, nextM] = addMonths(y, m, +1);

    const start = `${prevY}-${pad(prevM)}-01T00:00:00`;
    const endDay = daysInMonth(nextY, nextM);
    const end = `${nextY}-${pad(nextM)}-${pad(endDay)}T23:59:59`;

    const data = await apiFetch(`/api/bookings?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`);
    bookingsCache[key] = data;
    return data;
}

function invalidateCache(y, m) {
    delete bookingsCache[monthKey(y, m)];
}

// ── Calendar rendering ────────────────────────────────────────────────
function groupByDay(bookings, y, m) {
    const map = {};
    for (const b of bookings) {
        // Parse ISO strings consistently by extracting date parts
        const startIso = b.start.substring(0, 10);
        const endIso = b.end.substring(0, 10);
        const [sy, sm, sd] = startIso.split('-').map(Number);
        const [ey, em, ed] = endIso.split('-').map(Number);

        // Iterate through every calendar day the booking spans
        let cur = new Date(sy, sm - 1, sd);
        let last = new Date(ey, em - 1, ed);

        while (cur <= last) {
            if (cur.getFullYear() === y && cur.getMonth() + 1 === m) {
                const day = cur.getDate();
                if (!map[day]) map[day] = [];
                map[day].push(b);
            }
            cur.setDate(cur.getDate() + 1);
        }
    }
    return map;
}

function chipHTML(b) {
    const d = new Date(b.start);
    const de = new Date(b.end);
    const timeStr = `${pad(d.getHours())}:${pad(d.getMinutes())}-${pad(de.getHours())}:${pad(de.getMinutes())}`;
    const machine = machines.find(m => m.id === b.machine_id);
    const machineName = machine ? machine.name : b.machine_name || "";
    const label = `${timeStr} ${b.applicant_name} · ${machineName}`;
    return `<div class="chip ${b.status}" data-id="${b.id}" onclick="openViewBooking(${b.id},event)">
        <span class="chip-dot"></span>
        <span class="chip-text" title="${label}">${label}</span>
    </div>`;
}

async function renderMain(y, m) {
    let bookings = [];
    try {
        bookings = await loadBookings(y, m);
    } catch (e) {
        showToast("載入預約失敗: " + e.message, "error");
    }
    const byDay = groupByDay(bookings, y, m);
    const weeks = buildCalGrid(y, m);

    const isCurrentMonth = (y === TODAY_YEAR && m === TODAY_MONTH);

    const tbody = document.getElementById("calBody");
    tbody.innerHTML = weeks.map(week => `
        <tr>${week.map(day => {
            if (!day) return `<td class="empty"></td>`;
            const isToday = isCurrentMonth && day === TODAY_DAY;
            const dayBookings = byDay[day] || [];
            const MAX = 3;
            const chips = dayBookings.slice(0, MAX).map(chipHTML).join("");
            const more = dayBookings.length > MAX
                ? `<div class="more-chip">+${dayBookings.length - MAX} 更多…</div>`
                : "";
            return `<td class="${isToday ? 'today' : ''}" onclick="openNewBooking(${y}, ${m}, ${day}, event)">
                <div class="cal-date">${day}</div>
                ${chips}
                ${more}
            </td>`;
        }).join("")}</tr>
    `).join("");

    document.getElementById("monthTitle").textContent = `${MONTH_NAMES_ZH[m]} ${y}`;
}

function buildCalGrid(y, m) {
    const days = daysInMonth(y, m);
    const start = firstWeekday(y, m);
    const cells = [];
    for (let i = 0; i < start; i++) cells.push(0);
    for (let d = 1; d <= days; d++) cells.push(d);
    while (cells.length % 7 !== 0) cells.push(0);
    const weeks = [];
    for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
    return weeks;
}

function renderMini(y, m, titleEl, tableEl, daysWithBookings) {
    titleEl.textContent = `${MONTH_NAMES_ZH[m]} ${y}`;
    const weeks = buildCalGrid(y, m);
    tableEl.innerHTML = `
        <thead><tr>${["一","二","三","四","五","六","日"].map(d => `<th>${d}</th>`).join("")}</tr></thead>
        <tbody>${weeks.map(week => `<tr>${week.map(day => {
            if (!day) return `<td class="empty">-</td>`;
            const has = daysWithBookings && daysWithBookings.has(day);
            return `<td class="${has ? "has-booking" : ""}">${day}</td>`;
        }).join("")}</tr>`).join("")}</tbody>
    `;
}

async function renderAll() {
    showLoading(true);
    try {
        await renderMain(curYear, curMonth);

        const [prevY, prevM] = addMonths(curYear, curMonth, -1);
        const [nextY, nextM] = addMonths(curYear, curMonth, +1);

        // Mini calendars: try to load bookings for prev/next month (optional, non-blocking)
        let prevDays = null, nextDays = null;
        try {
            const prevB = await loadBookings(prevY, prevM);
            prevDays = new Set(prevB.map(b => new Date(b.start).getDate()));
        } catch (e) { console.warn("Failed to load prev month bookings:", e); }
        try {
            const nextB = await loadBookings(nextY, nextM);
            nextDays = new Set(nextB.map(b => new Date(b.start).getDate()));
        } catch (e) { console.warn("Failed to load next month bookings:", e); }

        renderMini(prevY, prevM,
            document.getElementById("miniPrevTitle"),
            document.getElementById("miniPrevTable"),
            prevDays);
        renderMini(nextY, nextM,
            document.getElementById("miniNextTitle"),
            document.getElementById("miniNextTable"),
            nextDays);
    } finally {
        showLoading(false);
    }
}

// ── Navigation ────────────────────────────────────────────────────────
function navigate(delta) {
    [curYear, curMonth] = addMonths(curYear, curMonth, delta);
    renderAll();
}
function jumpToToday() {
    curYear  = TODAY_YEAR;
    curMonth = TODAY_MONTH;
    renderAll();
}
function jumpToPrev() {
    [curYear, curMonth] = addMonths(curYear, curMonth, -1);
    renderAll();
}
function jumpToNext() {
    [curYear, curMonth] = addMonths(curYear, curMonth, +1);
    renderAll();
}

// ── Loading ────────────────────────────────────────────────────────────
function showLoading(on) {
    document.getElementById("loadingOverlay").classList.toggle("show", on);
}

// ── Toast ──────────────────────────────────────────────────────────────
let _toastTimer;
function showToast(msg, type = "success") {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = `show ${type}`;
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { el.className = ""; }, 3000);
}

// ── Status badge HTML ──────────────────────────────────────────────────
function statusBadgeHTML(status) {
    const c = STATUS_COLORS[status] || STATUS_COLORS.pending;
    const label = STATUS_LABEL[status] || status;
    return `<span class="status-badge" style="background:${c.bg};color:${c.text}">
        <span style="width:8px;height:8px;border-radius:50%;background:${c.dot};display:inline-block"></span>
        ${label}
    </span>`;
}

// ── Booking Modal: New ─────────────────────────────────────────────────
function openNewBooking(y, m, day, evt) {
    if (evt) evt.stopPropagation();
    editingId = null;

    document.getElementById("bookingModalTitle").textContent = "新增預約";
    document.getElementById("viewMode").style.display = "none";
    document.getElementById("editMode").style.display = "block";

    // Default date
    const dateStr = `${y}-${pad(m)}-${pad(day)}`;
    document.getElementById("fStartDate").value = dateStr;
    document.getElementById("fEndDate").value   = dateStr;
    document.getElementById("fStartTime").value = "09:00";
    document.getElementById("fEndTime").value   = "10:00";
    document.getElementById("fPurpose").value   = "";
    document.getElementById("fNotes").value     = "";
    document.getElementById("fStatus").value    = "pending";
    if (machines.length) document.getElementById("fMachine").selectedIndex = 0;

    setFooter("create");
    document.getElementById("bookingOverlay").classList.add("open");
    setTimeout(() => document.getElementById("fPurpose").focus(), 100);
}

// ── Booking Modal: View ────────────────────────────────────────────────
function openViewBooking(id, evt) {
    if (evt) evt.stopPropagation();
    const key = monthKey(curYear, curMonth);
    const allB = bookingsCache[key] || [];
    // search across all cached months too
    let booking = null;
    for (const bArr of Object.values(bookingsCache)) {
        booking = bArr.find(b => b.id === id);
        if (booking) break;
    }
    if (!booking) { showToast("找不到預約", "error"); return; }

    editingId = id;
    document.getElementById("bookingModalTitle").textContent = "預約詳情";
    document.getElementById("viewMode").style.display = "block";
    document.getElementById("editMode").style.display = "none";

    // fill detail view
    document.getElementById("dStatus").innerHTML = statusBadgeHTML(booking.status);
    document.getElementById("dStart").textContent = fmtDatetime(booking.start);
    document.getElementById("dEnd").textContent   = fmtDatetime(booking.end);
    document.getElementById("dUser").textContent  = booking.applicant_name;
    document.getElementById("dMachine").textContent = booking.machine_name;
    document.getElementById("dPurpose").textContent = booking.purpose;
    const notesRow = document.getElementById("dNotesRow");
    const title = (booking.title || "").trim();
    if (title && title !== DEFAULT_TITLE) {
        document.getElementById("dNotes").textContent = title;
        notesRow.style.display = "";
    } else {
        notesRow.style.display = "none";
    }

    setFooter("view", booking.can_edit);
    document.getElementById("bookingOverlay").classList.add("open");
}

// ── Booking Modal: Edit ────────────────────────────────────────────────
function switchToEdit() {
    let booking = null;
    for (const bArr of Object.values(bookingsCache)) {
        booking = bArr.find(b => b.id === editingId);
        if (booking) break;
    }
    if (!booking) return;

    document.getElementById("bookingModalTitle").textContent = "編輯預約";
    document.getElementById("viewMode").style.display = "none";
    document.getElementById("editMode").style.display = "block";

    document.getElementById("fStartDate").value = isoToDateStr(booking.start);
    document.getElementById("fEndDate").value   = isoToDateStr(booking.end);
    document.getElementById("fStartTime").value = isoToTimeStr(booking.start);
    document.getElementById("fEndTime").value   = isoToTimeStr(booking.end);
    if (booking.user_id) {
        document.getElementById("fUser").value = String(booking.user_id);
    }
    document.getElementById("fMachine").value   = booking.machine_id;
    document.getElementById("fPurpose").value   = booking.purpose;
    const title = (booking.title || "").trim();
    document.getElementById("fNotes").value     = title === DEFAULT_TITLE ? "" : title;
    document.getElementById("fStatus").value    = booking.status;

    setFooter("edit");
}

// ── Footer buttons ─────────────────────────────────────────────────────
function setFooter(mode, canEdit) {
    const f = document.getElementById("bookingModalFooter");
    if (mode === "create") {
        f.innerHTML = `
            <button class="btn btn-secondary" onclick="closeBookingModal()">Cancel</button>
            <button class="btn btn-primary" onclick="submitBooking()">Create</button>
        `;
    } else if (mode === "view") {
        f.innerHTML = `
            <button class="btn btn-secondary" onclick="closeBookingModal()">Close</button>
            ${canEdit ? '<button class="btn btn-primary" onclick="switchToEdit()">Edit</button>' : ""}
            ${canEdit ? '<button class="btn btn-danger" onclick="openDeleteConfirm()">Delete</button>' : ""}
        `;
    } else if (mode === "edit") {
        f.innerHTML = `
            <button class="btn btn-secondary" onclick="closeBookingModal()">Cancel</button>
            <button class="btn btn-primary" onclick="submitBooking()">Save</button>
        `;
    }
}

async function submitBooking() {
    const startDate = document.getElementById("fStartDate").value;
    const startTime = document.getElementById("fStartTime").value;
    const endDate   = document.getElementById("fEndDate").value;
    const endTime   = document.getElementById("fEndTime").value;
    const machineId = document.getElementById("fMachine").value;
    const userId    = document.getElementById("fUser").value;
    const purpose   = document.getElementById("fPurpose").value.trim();
    const notes     = document.getElementById("fNotes").value.trim();
    const status    = document.getElementById("fStatus").value;

    if (!purpose) { showToast("請填寫使用目的", "error"); return; }
    if (Number.isNaN(machineId) || machineId <= 0) { showToast("請選擇機台", "error"); return; }

    const start = `${startDate}T${startTime}:00`;
    const end   = `${endDate}T${endTime}:00`;
    if (new Date(start) >= new Date(end)) {
        showToast("結束時間必須晚於開始時間", "error"); return;
    }

    const payload = {
        start,
        end,
        user_id: userId,
        machine_id: machineId,
        purpose,
        title: notes || DEFAULT_TITLE,
        status,
    };

    showLoading(true);
    try {
        if (editingId) {
            await apiFetch(`/api/bookings/${editingId}`, {
                method: "PUT",
                body: JSON.stringify(payload),
            });
            showToast("預約已更新 ✓", "success");
        } else {
            await apiFetch("/api/bookings", {
                method: "POST",
                body: JSON.stringify(payload),
            });
            showToast("預約已建立 ✓", "success");
        }
        closeBookingModal();
        // invalidate cache for affected months
        const startM = new Date(start).getMonth() + 1;
        const startY = new Date(start).getFullYear();
        const endM   = new Date(end).getMonth() + 1;
        const endY   = new Date(end).getFullYear();
        invalidateCache(startY, startM);
        if (startY !== endY || startM !== endM) invalidateCache(endY, endM);
        await renderAll();
    } catch (e) {
        const msg = e.message;
        if (msg.includes("conflict")) {
            showToast("⚠️ 時間或機台衝突，請調整", "error");
        } else {
            showToast("操作失敗: " + msg, "error");
        }
    } finally {
        showLoading(false);
    }
}

// ── Delete ─────────────────────────────────────────────────────────────
function openDeleteConfirm() {
    deleteTargetId = editingId;
    document.getElementById("confirmOverlay").classList.add("open");
}
function closeConfirm() {
    document.getElementById("confirmOverlay").classList.remove("open");
    deleteTargetId = null;
}

async function confirmDelete() {
    if (!deleteTargetId) return;
    showLoading(true);
    try {
        await apiFetch(`/api/bookings/${deleteTargetId}`, { method: "DELETE" });
        showToast("預約已刪除", "success");
        closeConfirm();
        closeBookingModal();
        // find which month the booking was in and invalidate cache
        for (const [key, arr] of Object.entries(bookingsCache)) {
            if (arr.find(b => b.id === deleteTargetId)) {
                delete bookingsCache[key];
            }
        }
        await renderAll();
    } catch (e) {
        showToast("刪除失敗: " + e.message, "error");
    } finally {
        showLoading(false);
    }
}

// ── Close overlays ─────────────────────────────────────────────────────
function closeBookingModal() {
    document.getElementById("bookingOverlay").classList.remove("open");
}

// Close overlays on backdrop click
document.getElementById("bookingOverlay").addEventListener("click", e => {
    if (e.target === document.getElementById("bookingOverlay")) closeBookingModal();
});
document.getElementById("confirmOverlay").addEventListener("click", e => {
    if (e.target === document.getElementById("confirmOverlay")) closeConfirm();
});

// ── Wire buttons ───────────────────────────────────────────────────────
document.getElementById("btnPrev").addEventListener("click", () => navigate(-1));
document.getElementById("btnNext").addEventListener("click", () => navigate(+1));
document.getElementById("btnToday").addEventListener("click", jumpToToday);
document.getElementById("confirmDeleteBtn").addEventListener("click", confirmDelete);

// ── Init ───────────────────────────────────────────────────────────────
(async () => {
    populateTimeSelects();
    try {
        await Promise.all([loadMachines(), loadQualifiedUsers()]);
    } catch (e) {
        showToast("載入資料失敗: " + e.message, "error");
    }
    await renderAll();
})();
</script>
