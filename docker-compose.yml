version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: xray-postgres
    environment:
      POSTGRES_DB: xray
      POSTGRES_USER: xray
      POSTGRES_PASSWORD: xray_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xray"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: xray-web
    environment:
      FLASK_DEBUG: 0
      SECRET_KEY: your-secret-key-change-in-production
      DATABASE_URL: postgresql://xray:xray_password_change_me@db:5432/xray
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      # OAuth Configuration
      OAUTH_ENABLED: "false"
      OAUTH_PROVIDER: frore
      OAUTH_CLIENT_ID: ""
      OAUTH_CLIENT_SECRET: ""
      OAUTH_AUTHORIZE_URL: ""
      OAUTH_TOKEN_URL: ""
      OAUTH_USERINFO_URL: ""
      OAUTH_REDIRECT_URI: ""
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:

networks:
  default:
    name: xray-network
